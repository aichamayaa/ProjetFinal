spring.application.name=clinique-medicale

# ============================================================
# BASE DE DONNÉES - H2 (développement/test - zéro configuration)
# ============================================================
spring.datasource.url=jdbc:h2:mem:cliniquedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# BASE DE DONNÉES - PostgreSQL (production - décommenter si besoin)
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/clinique_db
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=votreMotDePasse

# ============================================================
# BASE DE DONNÉES - MySQL (production - décommenter si besoin)
# ============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/clinique_db?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=votreMotDePasse

# ============================================================
# JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration=86400000

# ============================================================
# SERVEUR
# ============================================================
server.port=8080

# ============================================================
# LOGGING
# ============================================================
logging.level.com.clinique=DEBUG
logging.level.org.springframework.security=INFO

# ============================================================
# SPRINGDOC / SWAGGER UI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
